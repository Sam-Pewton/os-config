---
- name: Enable multilib repositories
  blockinfile:
    path: /etc/pacman.conf
    marker: "# {mark} ANSIBLE ENABLED MULTILIB BLOCK"
    marker_begin: "START"
    marker_end: "END"
    block: |
      [multilib]
      Include = /etc/pacman.d/mirrorlist
  become: true
  become_method: sudo

- name: Update all base pacman packages
  pacman:
    update_cache: yes
    upgrade: yes
  become: true
  become_method: sudo

- name: Install pacman packages
  pacman:
    name: "{{ item }}"
    state: latest
    extra_args: --overwrite "*"
  become: true
  become_method: sudo
  with_items: "{{ pacman_packages }}"

- include_tasks: aur_makepkg.yaml
  loop: "{{ aur_packages }}"

# sudo required due to permissions gitmux gives to files
- name: Get user home path
  shell: "echo $HOME"
  register: user_home

- name: Remove temporary package download directory
  file:
    path: "{{ user_home }}/{{ package_dl_directory }}"
    state: absent
  become: true
  become_method: sudo
...
